<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Products</title>
  <link rel="icon" type="image/icon" href="img/icon.png">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/index.css">
  <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/w3data.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="admin/js/data.js"></script>

  <script type="text/javascript" src="js/common.js"></script>
  <script type="text/javascript" src="js/show-product.js"></script>
  <script src="js/javascript.js" type="text/javascript"></script>
  <link rel="stylesheet" type="text/css" href="css/product.css">
  <style type="text/css"></style>

  <link rel="stylesheet" href="css/remodal.css">
  <link rel="stylesheet" href="css/remodal-default-theme.css">
  <script src="js/remodal.min.js"></script>
</head>

<body>

  <div w3-include-html="include/header.html"></div>




  <div w3-include-html="include/nav.html"></div>

  <div class="body-page" id="body">

    <div class="showProduct" id="product">

      <div class="sort">
        <div class="sortByCompany">
          <span>Filter by brand: </span>
          <select name="sortByCompany" id="selectCompany">
            <option>All</option>
          </select>
        </div>

        <div class="sortByPrice">
          <span>Price: </span>
          <select name="sortByPrice" id="sortByPrice">
            <option>Ascending</option>
            <option>Descending</option>
            <option>5M-10M</option>
            <option>10M-15M</option>
            <option>15M-20M</option>
          </select>
        </div>

      </div>

      <div class="container paginated" id="container">
        <div style="height: 40px"></div>
      </div>
      <div class="clear-fix"></div>
    </div>
    <div w3-include-html="include/footer.html"></div>



</body>

</html>
<script type="text/javascript">w3IncludeHTML();</script>
