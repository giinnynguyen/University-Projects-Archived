<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <link rel="icon" type="image/icon" href="img/icon.png">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/index.css">
  <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/w3data.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="admin/js/data.js"></script>
  <script src="js/javascript.js" type="text/javascript"></script>
  <link rel="stylesheet" href="css/remodal.css">
  <link rel="stylesheet" href="css/remodal-default-theme.css">
  <script src="js/remodal.min.js"></script>
  <style>
    .form {
      overflow: hidden;
    }
  </style>


  <script type="text/javascript">
    $(function () {
      $("tbody").html(function () {
        var s = "";
        for (var i = 0; i < loginUser.cart.length; i++) {
          s += " <tr><td>" + loginUser.cart[i].ten_san_pham + "</td><td>" + loginUser.cart[i].count + "</td><td>" + (loginUser.cart[i].count * loginUser.cart[i].price).formatMoney(0, ",", ".") + " VND</td></tr>";
        };
        return s;

      });
    });
  </script>
  <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

  <div w3-include-html="include/header.html"></div>



  <div w3-include-html="include/nav.html"></div>

  <div class="body-page" id="body">
    <div class="container" style="min-height: 500px">
      <ul class="one-step-checkout clearfix">
        <h1 class="checkout_header">Checkout</h1>

        <form action="" class="form">
          <div id="onestepcheckout-shipping-payment-review">
            <div class="order-review-section">
              <h3>Payment methods</h3>
              <div class="clear"></div>
              <div class="onestepcheckout-payment-methods">
                <dl class="sp-methods">
                  <dt>
                    <input type="radio" id="payment" name="payment" checked
                      value="Pay with an international Visa/Mastercard">
                    <label for="">Pay with an international Visa/Mastercard</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Pay with a domestic ATM card">
                    <label for="">Pay with a domestic ATM card</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Bank transfer">
                    <label for="">Bank transfer</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Cash on delivery">
                    <label for="">Cash on delivery</label>
                  </dt>
                </dl>
              </div>
            </div>
            <div class="onestepcheckout-review-info">
              <div class="order-review-info">
                <h3>Review your order</h3>
                <div class="clear"></div>
                <table class="data-table">
                  <thead>
                    <tr class="first">
                      <th>Product name</th>
                      <th>Quantity</th>
                      <th>Subtotal</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
                <div class="clear"></div>
                <div style="text-align: center; margin-bottom: 10px"><a href="javascript:void(0)" class="submit"
                    onclick="dat_hang();">Confirm order</a></div>
              </div>
            </div>

          </div>
        </form>
      </ul>


    </div>
  </div>
  <div w3-include-html="include/footer.html"></div>
</body>

</html>
<script type="text/javascript">w3IncludeHTML();</script>
